<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 180" role="img" aria-label="contacto">
  <defs>
    <linearGradient id="vig_contacto" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="30%" stop-color="#0a0a0a"/>
      <stop offset="70%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#3d0a20"/>
    </linearGradient>
    <linearGradient id="fadeL_contacto" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="1"/>
      <stop offset="8%" stop-color="#000" stop-opacity="0"/>
      <stop offset="92%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="accLine_contacto" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6482" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff6482" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ff6482" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6482" stop-opacity="0"/>
    </linearGradient>
    <mask id="fm_contacto"><rect width="1600" height="180" fill="url(#fadeL_contacto)"/></mask>
    <style>
      .num_contacto { font: 700 110px "SF Mono",ui-monospace,monospace; fill:#ff6482; opacity:0.18; letter-spacing:-4px; }
      .ttl_contacto { font: 600 64px -apple-system,"SF Pro Display","Inter",system-ui,sans-serif; letter-spacing:-2.5px; fill:#ffffff; }
      .sub_contacto { font: 400 18px -apple-system,"SF Pro Text","Inter",system-ui,sans-serif; fill:#a1a1a6; }
      .tag_contacto { font: 600 11px "SF Mono",ui-monospace,monospace; letter-spacing:2.4px; fill:#ff6482; text-transform:uppercase; }
      .pr_contacto  { font: 700 48px "SF Mono",ui-monospace,monospace; fill:#ff6482; }
      .wv_contacto  { fill:none; stroke:#ff6482; stroke-width:1; opacity:0.22; }
      .wv2_contacto { fill:none; stroke:#1a1a1a; stroke-width:1; }
      .drift_contacto { animation: drift_contacto 14s ease-in-out infinite; }
      .pulse_contacto { animation: pulse_contacto 2.6s ease-in-out infinite; }
      .caret_contacto { animation: caret_contacto 1.1s steps(1) infinite; fill:#ff6482; }
      @keyframes drift_contacto { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-24px)} }
      @keyframes pulse_contacto { 0%,100%{opacity:1} 50%{opacity:0.3} }
      @keyframes caret_contacto { 0%,50%{opacity:1} 51%,100%{opacity:0} }
    </style>
  </defs>
  <rect width="1600" height="180" fill="url(#vig_contacto)"/>
  <g mask="url(#fm_contacto)" class="drift_contacto">
    <path class="wv_contacto"  d="M 0 40 Q 250 10 500 40 T 1000 40 T 1500 40 T 1600 40"/>
    <path class="wv2_contacto" d="M 0 90 Q 250 60 500 90 T 1000 90 T 1500 90 T 1600 90"/>
    <path class="wv_contacto"  d="M 0 140 Q 250 110 500 140 T 1000 140 T 1500 140 T 1600 140"/>
  </g>
  <text x="1480" y="140" class="num_contacto" text-anchor="end">07</text>
  <g transform="translate(100, 60)">
    <text class="tag_contacto">section / 07</text>
    <g transform="translate(0, 58)">
      <text class="pr_contacto">&gt;</text>
      <text x="44" y="0" class="ttl_contacto">contacto<tspan class="caret_contacto" dx="8">_</tspan></text>
    </g>
    <text y="90" class="sub_contacto">Abierto a consultoria enterprise.</text>
  </g>
  <rect x="100" y="170" width="1400" height="2" fill="url(#accLine_contacto)"/>
</svg>
