<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Joseph Fabrizzio · Lead Software Architect · CometaX">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#050508"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="20%" r="40%">
      <stop offset="0%"  stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text-gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="50%"  stop-color="#7de8ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-1;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0f1020" stroke-width="0.6"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .brand    { font: 700 68px "JetBrains Mono","Space Mono",ui-monospace,monospace; letter-spacing: -1px; }
      .role     { font: 600 18px "JetBrains Mono",ui-monospace,monospace; letter-spacing: 4.5px; fill:#a8a8b3; }
      .mono-sm  { font: 500 13px "JetBrains Mono",ui-monospace,monospace; letter-spacing: 2.8px; fill:#00e5ff; }
      .mono-md  { font: 600 14px "JetBrains Mono",ui-monospace,monospace; letter-spacing: 2.5px; fill:#00e5ff; }
      .chip-txt { font: 600 12px "JetBrains Mono",ui-monospace,monospace; letter-spacing: 1.4px; fill:#e6f7fb; text-transform: uppercase; }
      .foot     { font: 500 13px "JetBrains Mono",ui-monospace,monospace; letter-spacing: 2px; fill:#6a6a7a; }
      .foot .hi { fill:#00e5ff; }
      .pulse    { animation: pulse 2.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
    </style>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- Top frame line -->
  <line x1="48" y1="34" x2="1152" y2="34" stroke="#1a1a2a" stroke-width="1"/>
  <line x1="48" y1="306" x2="1152" y2="306" stroke="#1a1a2a" stroke-width="1"/>

  <!-- Status bar (CometaX style) -->
  <g transform="translate(48, 50)">
    <circle cx="6" cy="14" r="4" fill="#00e5ff" class="pulse"/>
    <text x="20" y="18" class="mono-sm">SYSTEM ONLINE  //  NEURAL LINK ACTIVE</text>
    <text x="1060" y="18" class="mono-sm" text-anchor="start" style="fill:#4a4a5a">v 2026.04</text>
  </g>

  <!-- Brand block -->
  <g transform="translate(48, 128)">
    <text class="brand" fill="url(#text-gloss)">JOSEPH FABRIZZIO</text>
    <text y="40" class="role">// LEAD SOFTWARE ARCHITECT  ·  LEGACY RESCUER</text>

    <!-- Chip row with inline SVG icons (no emojis) -->
    <g transform="translate(0, 80)">
      <!-- Chip 1: CometaX -->
      <g>
        <rect width="198" height="34" rx="4" fill="#0a0f1d" stroke="#1a3550"/>
        <g transform="translate(12, 10)" fill="none" stroke="#00e5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- rocket icon -->
          <path d="M2 13 L7 8 L11 8 Q14 3 18 2 Q17 6 12 9 L12 13 L7 18 L2 13 Z"/>
          <circle cx="14" cy="6" r="1.2" fill="#00e5ff"/>
        </g>
        <text x="40" y="22" class="chip-txt">CO-FOUNDER / COMETAX</text>
      </g>

      <!-- Chip 2: Rankit -->
      <g transform="translate(214, 0)">
        <rect width="180" height="34" rx="4" fill="#0a0f1d" stroke="#1a3550"/>
        <g transform="translate(12, 10)" fill="none" stroke="#00e5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- gamepad icon -->
          <rect x="1" y="5" width="18" height="10" rx="4"/>
          <line x1="6" y1="10" x2="9" y2="10"/>
          <line x1="7.5" y1="8.5" x2="7.5" y2="11.5"/>
          <circle cx="14" cy="9" r="0.8" fill="#00e5ff"/>
          <circle cx="16" cy="11" r="0.8" fill="#00e5ff"/>
        </g>
        <text x="40" y="22" class="chip-txt">FOUNDER / RANKIT.PRO</text>
      </g>

      <!-- Chip 3: JMB -->
      <g transform="translate(410, 0)">
        <rect width="188" height="34" rx="4" fill="#0a0f1d" stroke="#1a3550"/>
        <g transform="translate(12, 10)" fill="none" stroke="#00e5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- architecture / columns icon -->
          <line x1="2" y1="4" x2="18" y2="4"/>
          <line x1="2" y1="16" x2="18" y2="16"/>
          <line x1="5" y1="4" x2="5" y2="16"/>
          <line x1="10" y1="4" x2="10" y2="16"/>
          <line x1="15" y1="4" x2="15" y2="16"/>
        </g>
        <text x="40" y="22" class="chip-txt">ARCHITECT / JMB</text>
      </g>

      <!-- Chip 4: PuntoZip -->
      <g transform="translate(614, 0)">
        <rect width="206" height="34" rx="4" fill="#0a0f1d" stroke="#1a3550"/>
        <g transform="translate(12, 10)" fill="none" stroke="#00e5ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- shield / rescue icon -->
          <path d="M10 2 L17 5 V11 Q17 16 10 18 Q3 16 3 11 V5 Z"/>
          <path d="M7 10 L9 12 L13 8"/>
        </g>
        <text x="40" y="22" class="chip-txt">CONSULTANT / PUNTOZIP</text>
      </g>
    </g>
  </g>

  <!-- Right-side orbit (cyan minimal) -->
  <g transform="translate(1030, 170)" fill="none">
    <circle r="118" stroke="#00e5ff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="48s" repeatCount="indefinite"/>
    </circle>
    <circle r="88" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="32s" repeatCount="indefinite"/>
    </circle>
    <!-- core -->
    <circle r="42" fill="#050508" stroke="#00e5ff" stroke-opacity="0.7" stroke-width="1.2"/>
    <circle r="42" fill="#00e5ff" fill-opacity="0.06"/>
    <!-- crosshair -->
    <line x1="-54" y1="0" x2="-44" y2="0" stroke="#00e5ff" stroke-opacity="0.5"/>
    <line x1="54" y1="0" x2="44" y2="0" stroke="#00e5ff" stroke-opacity="0.5"/>
    <line x1="0" y1="-54" x2="0" y2="-44" stroke="#00e5ff" stroke-opacity="0.5"/>
    <line x1="0" y1="54" x2="0" y2="44" stroke="#00e5ff" stroke-opacity="0.5"/>
    <!-- glyph inside: JF -->
    <text x="0" y="6" text-anchor="middle" class="mono-md" style="font-size:22px; letter-spacing:1px; fill:#00e5ff;">JF</text>
    <!-- orbiting satellite -->
    <g>
      <rect x="-3" y="-91" width="6" height="6" rx="1" fill="#00e5ff">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Micro stars -->
  <g fill="#00e5ff" opacity="0.35">
    <rect x="300" y="60" width="1.5" height="1.5"/>
    <rect x="540" y="82" width="1.5" height="1.5"/>
    <rect x="720" y="48" width="1.5" height="1.5"/>
    <rect x="860" y="88" width="1.5" height="1.5"/>
    <rect x="400" y="260" width="1.5" height="1.5"/>
    <rect x="680" y="280" width="1.5" height="1.5"/>
    <rect x="900" y="260" width="1.5" height="1.5"/>
  </g>

  <!-- Bottom credentials bar -->
  <g transform="translate(48, 326)">
    <text class="foot">
      <tspan class="hi">IPN UPIICSA</tspan>  //  <tspan class="hi">GRADUADO @ 19</tspan> POR <tspan class="hi">ACUERDO / LEY 286</tspan>  //  <tspan class="hi">TESIS PROFESIONAL</tspan> ·  IOT · ESP32 · FASTAPI  //  PROGRAMANDO DESDE LOS 10
    </text>
  </g>
</svg>
