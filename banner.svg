<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-label="Joseph Fabrizzio">
  <defs>
    <clipPath id="avatarClip"><circle cx="40" cy="40" r="38"/></clipPath>
    <clipPath id="nameReveal">
      <rect x="0" y="0" height="180" width="0">
        <animate attributeName="width" from="0" to="1100" dur="3.2s" fill="freeze" begin="0.3s"/>
      </rect>
    </clipPath>
    <clipPath id="subReveal">
      <rect x="0" y="0" height="40" width="0">
        <animate attributeName="width" from="0" to="760" dur="1.6s" fill="freeze" begin="3.6s"/>
      </rect>
    </clipPath>
    <style>
      .brand { font: 200 148px -apple-system,"SF Pro Display","Inter",system-ui,sans-serif; letter-spacing: -6px; fill:#ffffff; }
      .sub { font: 300 20px -apple-system,"SF Pro Text","Inter",system-ui,sans-serif; letter-spacing: -0.2px; fill:#6e6e73; }
      .meta-k { font: 500 11px "SF Mono",ui-monospace,monospace; letter-spacing: 2.4px; fill:#48484a; text-transform: uppercase; }
      .meta-v { font: 400 14px -apple-system,"SF Pro Text","Inter",system-ui,sans-serif; fill:#d2d2d7; }
      .tiny { font: 500 10px "SF Mono",ui-monospace,monospace; letter-spacing: 2px; fill:#3a3a3c; text-transform: uppercase; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }
    </style>
  </defs>

  <rect width="1600" height="560" fill="#000000"/>

  <g transform="translate(100, 88)">
    <circle cx="40" cy="40" r="39.5" fill="none" stroke="#1c1c1e" stroke-width="1"/>
    <image href="data:image/jpeg;base64," x="2" y="2" width="76" height="76" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <g transform="translate(196, 110)">
    <text class="tiny">Joseph Fabrizzio</text>
    <g transform="translate(0, 22)">
      <circle cx="4" cy="6" r="3.2" fill="#30d158" class="pulse"/>
      <text x="16" y="10" class="tiny" fill="#6e6e73">Available</text>
    </g>
  </g>

  <g transform="translate(100, 288)">
    <g clip-path="url(#nameReveal)">
      <text class="brand">Joseph Fabrizzio</text>
    </g>
    <rect x="0" y="-108" width="3" height="128" fill="#ffffff" opacity="0.6">
      <animate attributeName="x" values="0;1100" dur="3.2s" fill="freeze" begin="0.3s"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1s" begin="3.5s" repeatCount="indefinite"/>
    </rect>

    <g clip-path="url(#subReveal)">
      <text y="44" class="sub">Lead Software Architect · Building legacy-rescue SaaS from Mexico City.</text>
    </g>
  </g>

  <g transform="translate(100, 460)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze" begin="5.2s"/>
    <g>
      <text class="meta-k">Focus</text>
      <text y="22" class="meta-v">Multi-tenant SaaS</text>
    </g>
    <g transform="translate(240, 0)">
      <text class="meta-k">Now</text>
      <text y="22" class="meta-v">CometaX · Rankit.pro</text>
    </g>
    <g transform="translate(520, 0)">
      <text class="meta-k">Stack</text>
      <text y="22" class="meta-v">Laravel · Vue · FastAPI · AWS</text>
    </g>
    <g transform="translate(880, 0)">
      <text class="meta-k">Since</text>
      <text y="22" class="meta-v">2016 · age 10</text>
    </g>
  </g>

  <rect x="100" y="530" width="1400" height="1" fill="#1c1c1e"/>
</svg>
