<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 180" role="img" aria-label="why i build differently">
  <defs>
    <linearGradient id="vig_why" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="30%" stop-color="#0a0a0a"/>
      <stop offset="70%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#2a0a3d"/>
    </linearGradient>
    <linearGradient id="fadeL_why" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="1"/>
      <stop offset="8%" stop-color="#000" stop-opacity="0"/>
      <stop offset="92%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="accLine_why" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bf5af2" stop-opacity="0"/>
      <stop offset="30%" stop-color="#bf5af2" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#bf5af2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bf5af2" stop-opacity="0"/>
    </linearGradient>
    <mask id="fm_why"><rect width="1600" height="180" fill="url(#fadeL_why)"/></mask>
    <style>
      .num_why { font: 700 110px "SF Mono",ui-monospace,monospace; fill:#bf5af2; opacity:0.18; letter-spacing:-4px; }
      .ttl_why { font: 600 64px -apple-system,"SF Pro Display","Inter",system-ui,sans-serif; letter-spacing:-2.5px; fill:#ffffff; }
      .sub_why { font: 400 18px -apple-system,"SF Pro Text","Inter",system-ui,sans-serif; fill:#a1a1a6; }
      .tag_why { font: 600 11px "SF Mono",ui-monospace,monospace; letter-spacing:2.4px; fill:#bf5af2; text-transform:uppercase; }
      .pr_why  { font: 700 48px "SF Mono",ui-monospace,monospace; fill:#bf5af2; }
      .wv_why  { fill:none; stroke:#bf5af2; stroke-width:1; opacity:0.22; }
      .wv2_why { fill:none; stroke:#1a1a1a; stroke-width:1; }
      .drift_why { animation: drift_why 14s ease-in-out infinite; }
      .pulse_why { animation: pulse_why 2.6s ease-in-out infinite; }
      .caret_why { animation: caret_why 1.1s steps(1) infinite; fill:#bf5af2; }
      @keyframes drift_why { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-24px)} }
      @keyframes pulse_why { 0%,100%{opacity:1} 50%{opacity:0.3} }
      @keyframes caret_why { 0%,50%{opacity:1} 51%,100%{opacity:0} }
    </style>
  </defs>
  <rect width="1600" height="180" fill="url(#vig_why)"/>
  <g mask="url(#fm_why)" class="drift_why">
    <path class="wv_why"  d="M 0 40 Q 250 10 500 40 T 1000 40 T 1500 40 T 1600 40"/>
    <path class="wv2_why" d="M 0 90 Q 250 60 500 90 T 1000 90 T 1500 90 T 1600 90"/>
    <path class="wv_why"  d="M 0 140 Q 250 110 500 140 T 1000 140 T 1500 140 T 1600 140"/>
  </g>
  <text x="1480" y="140" class="num_why" text-anchor="end">02</text>
  <g transform="translate(100, 60)">
    <text class="tag_why">section / 02</text>
    <g transform="translate(0, 58)">
      <text class="pr_why">&gt;</text>
      <text x="44" y="0" class="ttl_why">why i build differently<tspan class="caret_why" dx="8">_</tspan></text>
    </g>
    <text y="90" class="sub_why">No soy un dev más. Soy fundador con teclado.</text>
  </g>
  <rect x="100" y="170" width="1400" height="2" fill="url(#accLine_why)"/>
</svg>
