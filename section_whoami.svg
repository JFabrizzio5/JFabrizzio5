<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 180" role="img" aria-label="whoami">
  <defs>
    <linearGradient id="vig_whoami" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="30%" stop-color="#0a0a0a"/>
      <stop offset="70%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#3d0a18"/>
    </linearGradient>
    <linearGradient id="fadeL_whoami" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="1"/>
      <stop offset="8%" stop-color="#000" stop-opacity="0"/>
      <stop offset="92%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="accLine_whoami" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff375f" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff375f" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ff375f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff375f" stop-opacity="0"/>
    </linearGradient>
    <mask id="fm_whoami"><rect width="1600" height="180" fill="url(#fadeL_whoami)"/></mask>
    <style>
      .num_whoami { font: 700 110px "SF Mono",ui-monospace,monospace; fill:#ff375f; opacity:0.18; letter-spacing:-4px; }
      .ttl_whoami { font: 600 64px -apple-system,"SF Pro Display","Inter",system-ui,sans-serif; letter-spacing:-2.5px; fill:#ffffff; }
      .sub_whoami { font: 400 18px -apple-system,"SF Pro Text","Inter",system-ui,sans-serif; fill:#a1a1a6; }
      .tag_whoami { font: 600 11px "SF Mono",ui-monospace,monospace; letter-spacing:2.4px; fill:#ff375f; text-transform:uppercase; }
      .pr_whoami  { font: 700 48px "SF Mono",ui-monospace,monospace; fill:#ff375f; }
      .wv_whoami  { fill:none; stroke:#ff375f; stroke-width:1; opacity:0.22; }
      .wv2_whoami { fill:none; stroke:#1a1a1a; stroke-width:1; }
      .drift_whoami { animation: drift_whoami 14s ease-in-out infinite; }
      .pulse_whoami { animation: pulse_whoami 2.6s ease-in-out infinite; }
      .caret_whoami { animation: caret_whoami 1.1s steps(1) infinite; fill:#ff375f; }
      @keyframes drift_whoami { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-24px)} }
      @keyframes pulse_whoami { 0%,100%{opacity:1} 50%{opacity:0.3} }
      @keyframes caret_whoami { 0%,50%{opacity:1} 51%,100%{opacity:0} }
    </style>
  </defs>
  <rect width="1600" height="180" fill="url(#vig_whoami)"/>
  <g mask="url(#fm_whoami)" class="drift_whoami">
    <path class="wv_whoami"  d="M 0 40 Q 250 10 500 40 T 1000 40 T 1500 40 T 1600 40"/>
    <path class="wv2_whoami" d="M 0 90 Q 250 60 500 90 T 1000 90 T 1500 90 T 1600 90"/>
    <path class="wv_whoami"  d="M 0 140 Q 250 110 500 140 T 1000 140 T 1500 140 T 1600 140"/>
  </g>
  <text x="1480" y="140" class="num_whoami" text-anchor="end">01</text>
  <g transform="translate(100, 60)">
    <text class="tag_whoami">section / 01</text>
    <g transform="translate(0, 58)">
      <text class="pr_whoami">&gt;</text>
      <text x="44" y="0" class="ttl_whoami">whoami<tspan class="caret_whoami" dx="8">_</tspan></text>
    </g>
    <text y="90" class="sub_whoami">Arquitecto que piensa en sistemas, no en tickets.</text>
  </g>
  <rect x="100" y="170" width="1400" height="2" fill="url(#accLine_whoami)"/>
</svg>
